name: Build Marp Presentation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Convert Markdown to HTML
        uses: KoharaKazuya/marp-cli-action@v4
        # По умолчанию он ищет все .md файлы и собирает их
        # Если нужно указать конкретный файл, можно добавить with: args: "3. ИСМУСЭ.md -o index.html"
        with: args: "3. ИСМУСЭ.md -o index.html"
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: . # Загружаем все собранные файлы

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
