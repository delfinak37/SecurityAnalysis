name: Build Marp Presentation

on:
  push:
    branches: [ main ]
    paths:
      - '3. ИСМУСЭ.md'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Convert Markdown to HTML and PPTX
        run: |
          mkdir -p dist output
          docker run --rm -v $PWD:/home/marp/app/ -e MARP_USER="$(id -u):$(id -g)" marpteam/marp-cli "3. ИСМУСЭ.md" -o dist/index.html
          docker run --rm -v $PWD:/home/marp/app/ -e MARP_USER="$(id -u):$(id -g)" marpteam/marp-cli "3. ИСМУСЭ.md" --pptx --allow-local-files -o "output/3. ИСМУСЭ.pptx"

      - name: Save PPTX to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add output/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Обновление PPTX презентации" && git push)

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
